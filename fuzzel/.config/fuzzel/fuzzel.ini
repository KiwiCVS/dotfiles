[main]
font=Nunito:size=16
prompt="› "
terminal=kitty -e
icons-enabled=no
lines=8
width=36
horizontal-pad=20
vertical-pad=16
inner-pad=8
exit-on-keyboard-focus-loss=yes

[colors]
background=0c0c0cbf
text=888888ff
match=e6e6e6ff
selection=ffffff1a
selection-text=e6e6e6ff
selection-match=e6e6e6ff
border=ffffff1a

[border]
width=2
radius=14
