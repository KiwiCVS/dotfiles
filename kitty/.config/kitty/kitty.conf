# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Window & Minimalist Padding
window_padding_width  16
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell     no

# Background & Transparency
background            #0c0c0c
foreground            #e0e0e0
background_opacity    0.78
background_blur       1

# Cursor & Selection
cursor                #e0e0e0
cursor_text_color     #000000
cursor_shape          block
cursor_blink_interval 0
selection_foreground  #000000
selection_background  #ffffff

# Minimal Tab Bar
tab_bar_style         hidden
tab_separator         "  "
tab_bar_min_tabs      2
active_tab_foreground #ffffff
active_tab_background #1a1a1a
inactive_tab_foreground #666666
inactive_tab_background #000000

# Strict Monochrome ANSI Palette
color0  #000000
color8  #4d4d4d

color1  #cccccc
color9  #ffffff

color2  #d9d9d9
color10 #ffffff

color3  #b3b3b3
color11 #e6e6e6

color4  #bfbfbf
color12 #f2f2f2

color5  #a6a6a6
color13 #d9d9d9

color6  #cccccc
color14 #ffffff

color7  #e6e6e6
color15 #ffffff
